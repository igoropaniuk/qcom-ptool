#
# Composes the shared Shikra sets from _common/ into two boot storages.
# eMMC keeps cdt in its boot area (phys-part 1); the SD card has no boot
# area, so cdt moves into the single user area ahead of the HLOS set.
platform:
  name: shikra-evk

storage:
  - id: emmc
    type: emmc
    size: 137438953472
    sector-size: 512
    write-protect-boundary: 0
    grow-last-partition: true
    phys-parts:
      - phys-part: 0        # last partition (rootfs) grows
        partitions:
          - include: _common/shikra-firmware.yaml
          - include: _common/shikra-hlos.yaml
      - phys-part: 1
        grow: false
        partitions:
          - include: _common/shikra-cdt.yaml
  - id: sdcard
    type: emmc
    size: 137438953472
    sector-size: 512
    write-protect-boundary: 0
    grow-last-partition: true
    partitions:             # last partition (rootfs) grows
      - include: _common/shikra-firmware.yaml
      - include: _common/shikra-cdt.yaml
      - include: _common/shikra-hlos.yaml
